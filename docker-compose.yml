services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cost_detective
      POSTGRES_PASSWORD: cost_detective
      POSTGRES_DB: cost_detective
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cost_detective -d cost_detective"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cost_detective:cost_detective@postgres:5432/cost_detective
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cost_detective:cost_detective@postgres:5432/cost_detective
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.workers.scan_job.WorkerSettings

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      VITE_DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
