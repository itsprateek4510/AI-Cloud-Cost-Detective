AWSTemplateFormatVersion: "2010-09-09"
Description: Read-only AWS Cost Detective role protected by a customer-specific ExternalId.

Parameters:
  TrustedPrincipalArn:
    Type: String
    Description: App AWS account root ARN or, preferably, its specific execution-role ARN.
    AllowedPattern: '^arn:aws(-us-gov|-cn)?:iam::[0-9]{12}:(root|role/[A-Za-z0-9_+=,.@/\-]+)$'
  ExternalId:
    Type: String
    Description: Exact external_id generated by POST /accounts; never choose your own.
    MinLength: 32
    MaxLength: 128
    AllowedPattern: '[A-Za-z0-9_-]+'

Resources:
  CustomerReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Ref: TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
      Policies:
        - PolicyName: CostDetectiveReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:Describe*
                  - rds:Describe*
                  - rds:ListTagsForResource
                  - elasticloadbalancing:Describe*
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - logs:DescribeLogGroups
                  - ce:GetCostAndUsage
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketPolicyStatus
                  - s3:ListAllMyBuckets
                Resource: "*"

Outputs:
  RoleArn:
    Description: Submit this ARN to POST /accounts/verify with account_id and external_id.
    Value:
      Fn::GetAtt: [CustomerReadOnlyRole, Arn]
